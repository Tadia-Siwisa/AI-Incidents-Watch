name: Incoming evidence intake (unverified)
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: evidence-intake
  cancel-in-progress: false
jobs:
  stage-evidence:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Evidence]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Stage unverified evidence
        run: python scripts/update_evidence_intake.py
      - name: Commit intake register and workbook only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intake/incoming_evidence.json data/intake/incoming_evidence.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "intake: stage unverified evidence update"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
