name: Incident lead intake
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: incident-intake
  cancel-in-progress: false
jobs:
  update-intake:
    if: github.event_name == 'workflow_dispatch' || (github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, '[Incident]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Import incident lead
        run: python scripts/update_incident_intake.py
      - name: Commit candidate data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intake/incident_leads.json data/intake/incident_leads.xlsx
          if ! git diff --cached --quiet; then
            git commit -m "Update unverified incident leads"
            git push origin HEAD:main
          fi
